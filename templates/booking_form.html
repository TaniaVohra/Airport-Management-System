<!DOCTYPE html>
<html>
<head>
    <title>Book Flight - SkyPort</title>

    <style>

    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:'Segoe UI',sans-serif;
    }

    body{
        min-height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        background:linear-gradient(135deg,#001f54,#034078,#1282a2,#00c6ff);
    }

    .container{
        background:white;
        width:450px;
        padding:35px;
        border-radius:20px;
        box-shadow:0 10px 25px rgba(0,0,0,0.3);
    }

    h1{
        text-align:center;
        color:#003366;
        margin-bottom:20px;
    }

    .flight-info{
        background:#f4f8ff;
        padding:15px;
        border-radius:10px;
        margin-bottom:20px;
    }

    .flight-info h2{
        color:#003366;
        margin-bottom:10px;
    }

    .flight-info p{
        margin:5px 0;
        color:#555;
    }

    label{
        display:block;
        margin-bottom:8px;
        font-weight:bold;
        color:#333;
    }

    input,
    select{
        width:100%;
        padding:12px;
        border:1px solid #ccc;
        border-radius:10px;
        margin-bottom:15px;
        font-size:16px;
    }

    button{
        width:100%;
        padding:14px;
        background:#00a651;
        color:white;
        border:none;
        border-radius:10px;
        font-size:18px;
        cursor:pointer;
        font-weight:bold;
    }

    button:hover{
        background:#008f45;
    }

    </style>

</head>
<body>

<div class="container">

    <h1>✈️ Book Flight</h1>

    <div class="flight-info">

        <h2>{{ flight[1] }}</h2>

        <p>📍 {{ flight[2] }} ➜ {{ flight[3] }}</p>

        <p>💰 ₹{{ flight[5] }}</p>

    </div>

    <form method="POST">
        <input type="hidden" name="flight_name" value="{{ flight[1] }}">
        <input type="hidden" name="from_city" value="{{ flight[2] }}">
        <input type="hidden" name="to_city" value="{{ flight[3] }}">
        <input type="hidden" name="price" value="{{ flight[5] }}">


        <label>Total Passengers</label>

        <input
            type="number"
            name="passenger_count"
            min="1"
            max="10"
            required
        >

        <label>Class Type</label>

        <select name="class_type">

            <option value="Economy">
                Economy
            </option>

            <option value="Premium Economy">
                Premium Economy
            </option>

            <option value="Business">
                Business
            </option>

            <option value="First Class">
                First Class
            </option>

        </select>

        <button type="submit">
            Continue
        </button>

    </form>

</div>

</body>
</html>
