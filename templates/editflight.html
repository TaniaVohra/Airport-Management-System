<!DOCTYPE html>
<html>
<head>
    <title>Edit Flight - SkyPort</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#0f172a,#2563eb,#06b6d4);
        }

        .container{
            width:450px;
            background:white;
            padding:35px;
            border-radius:20px;
            box-shadow:0 10px 30px rgba(0,0,0,0.3);
        }

        h1{
            text-align:center;
            color:#1e3a8a;
            margin-bottom:25px;
        }

        input{
            width:100%;
            padding:12px;
            margin:10px 0;
            border:1px solid #ccc;
            border-radius:10px;
            font-size:16px;
        }

        button{
            width:100%;
            padding:12px;
            background:#2563eb;
            color:white;
            border:none;
            border-radius:10px;
            font-size:18px;
            cursor:pointer;
            margin-top:10px;
        }

        button:hover{
            background:#1d4ed8;
        }

        .back-btn{
            display:inline-block;
            margin-bottom:15px;
            text-decoration:none;
            color:#2563eb;
            font-weight:bold;
        }

    </style>

</head>

<body>

<div class="container">

    <a href="/manageflights" class="back-btn">
        ← Back to Manage Flights
    </a>

    <h1>✈️ Edit Flight</h1>

    <form method="POST">

        <input type="text" name="flight_name"
               value="{{ flight[1] }}" required>

        <input type="text" name="source"
               value="{{ flight[2] }}" required>

        <input type="text" name="destination"
               value="{{ flight[3] }}" required>

        <input type="date" name="departure_date"
               value="{{ flight[4] }}" required>

        <input type="number" name="price"
               value="{{ flight[5] }}" required>

        <button type="submit">
            ✏️ Update Flight
        </button>

    </form>

</div>

</body>
</html>
