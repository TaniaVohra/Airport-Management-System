<!DOCTYPE html>
<html>
<head>
    <title>Passenger Details - SkyPort</title>

    <style>

    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:'Segoe UI',sans-serif;
    }

    body{
        min-height:100vh;
        background:linear-gradient(135deg,#001f54,#034078,#1282a2,#00c6ff);
        display:flex;
        justify-content:center;
        align-items:center;
        padding:30px;
    }

    .container{
        width:700px;
        background:white;
        padding:35px;
        border-radius:20px;
        box-shadow:0 10px 25px rgba(0,0,0,0.3);
    }

    h1{
        text-align:center;
        color:#003366;
        margin-bottom:30px;
    }

    .passenger-box{
        background:#f4f8ff;
        padding:20px;
        border-radius:15px;
        margin-bottom:20px;
    }

    .passenger-box h3{
        color:#003366;
        margin-bottom:15px;
    }

    input,select{
        width:100%;
        padding:12px;
        margin-top:8px;
        margin-bottom:15px;
        border:1px solid #ccc;
        border-radius:10px;
        font-size:16px;
    }

    button{
        width:100%;
        padding:15px;
        background:#00a651;
        color:white;
        border:none;
        border-radius:10px;
        font-size:18px;
        font-weight:bold;
        cursor:pointer;
    }

    button:hover{
        background:#008f45;
    }

    </style>

</head>
<body>

<div class="container">

<h1>✈️ Passenger Details</h1>

<form method="POST" action="/seat-selection">

    <input type="hidden" name="passenger_count" value="{{ passenger_count }}">
    <input type="hidden" name="class_type" value="{{ class_type }}">
    <input type="hidden" name="flight_name" value="{{ flight[1] }}">
    <input type="hidden" name="from_city" value="{{ flight[2] }}">
    <input type="hidden" name="to_city" value="{{ flight[3] }}">
    <input type="hidden" name="departure_date" value="{{ flight[4] }}">
    <input type="hidden" name="price" value="{{ flight[5] }}">

{% for i in range(passenger_count) %}

<div class="passenger-box">

<h3>Passenger {{ i+1 }}</h3>

<input
type="text"
name="passenger_name_{{ i }}"
placeholder="Passenger Name"
required>

<input
type="number"
name="age_{{ i }}"
placeholder="Age"
required>

<select name="gender_{{ i }}" required>
    <option value="">Select Gender</option>
    <option>Male</option>
    <option>Female</option>
    <option>Other</option>
</select>

</div>

{% endfor %}

<button type="submit">
Continue to Seat Selection
</button>

<input type="hidden" name="passenger_count" value="{{ passenger_count }}">

<input type="hidden" name="class_type" value="{{ class_type }}">

</form>

</div>

</body>
</html>
