<!DOCTYPE html>
<html>
<head>
    <title>Search Flights - SkyPort</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI',sans-serif;
        }

        body{
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;

        background:
        linear-gradient(
        rgba(0,0,0,0.5),
        rgba(0,0,0,0.5)
    ),
    url('/static/images/airport2.webp');

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
}

        .container{
            text-align:center;
        }

        .logo{
            color:white;
            font-size:80px;
            font-weight:bold;
            margin-bottom:10px;
            text-shadow:0 5px 10px rgba(0,0,0,0.3);
        }

        .subtitle{
            color:white;
            font-size:20px;
            margin-bottom:20px;
        }

        .tagline{
            color:#dbeafe;
            font-size:18px;
            margin-bottom:25px;
        }

        .search-box{
            background:rgba(255,255,255,0.95);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.3);
            width:500px;
            padding:35px;
            border-radius:25px;

            box-shadow:
            0 15px 35px rgba(0,0,0,0.25);
        }

        input{
            width:100%;
            padding:15px;
            margin:12px 0;

            border:2px solid #dbeafe;
            border-radius:12px;

            font-size:16px;
            background:#f8fafc;
        }

        input:focus{
            outline:none;
            border-color:#00c6ff;
            box-shadow:0 0 10px rgba(0,198,255,0.3);
        }

        button{
            width:100%;
            padding:15px;
            margin-top:10px;

            border:none;
            border-radius:12px;

            background:#f4b942;
            color:white;

            font-size:18px;
            font-weight:bold;
            cursor:pointer;
        }

        button:hover{
            transform: translateY(-3px);
            transition: 0.3s;
        }

        .footer{
            color:white;
            margin-top:20px;
            font-size:14px;
        }

    </style>

</head>

<body>

<div class="container">

    <h1 class="logo">✈ SkyPort</h1>

    <p class="subtitle">
        Find and book flights in seconds
    </p>

    <p class="tagline">
        ✈ Search Flights • 🎫 Easy Booking • 🌍 Travel Anywhere
    </p>

    <div class="search-box">

        <form method="POST" action="/search">

        

            <input
                type="text"
                name="source"
                placeholder="🛫 From City"
                required
            >

            <input
                type="text"
                name="destination"
                placeholder="🛬 To City"
                required
            >

            <button type="submit">
                Search Flights
            </button>

        </form>

    </div>

    <div class="footer">
        © 2026 SkyPort Airport Management System
    </div>

</div>

</body>
</html>
