<!DOCTYPE html>
<html>
<head>
    <title>View Bookings - SkyPort</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{
            min-height:100vh;
            background:linear-gradient(135deg,#0f172a,#06b6d4);
            padding:40px;
        }

        .container{
            width:95%;
            margin:auto;
        }

        h1{
            text-align:center;
            color:white;
            margin-bottom:30px;
            font-size:50px;
        }

        .back-btn{
            display:inline-block;
            background:white;
            color:#003366;
            text-decoration:none;
            padding:12px 20px;
            border-radius:10px;
            font-weight:bold;
            margin-bottom:20px;
        }

        .table-box{
            background:white;
            border-radius:20px;
            overflow:hidden;
            box-shadow:0 8px 20px rgba(0,0,0,0.2);
            overflow-x: auto;
        }

        table{
            width:100%;
            border-collapse:collapse;
        }

        th{
            background:#003366;
            color:white;
            padding:18px;
        }

        td{
            padding:16px;
            text-align:center;
            border-bottom:1px solid #ddd;
        }

        tr:hover{
            background:#f1f5f9;
        }

        th,td{
            text-align: cetre;
            padding: 12px;
        }

    </style>

</head>
<body>

<div class="container">

    <a href="/admin" class="back-btn">🏠 Back to Admin</a>

    <h1>🎫 All Bookings</h1>

    <div class="table-box">

        <table>

            <tr>
                <th>ID</th>
                <th>Flight</th>
                <th>Passenger Name</th>
                <th>Status</th>
                <th>Update</th>
                <th>Action</th>
            </tr>

            {% for booking in bookings %}

            <tr>
                <td>{{ booking[0] }}</td>
                <td>{{ booking[1] }}</td>
                <td>{{ booking[6] }}</td>
                <td>{{ booking[11] }}</td>
                <td>
                <form action="/update-status/{{ booking[0] }}" method="POST">
                <select name="status">
                    <option value="On Time" {% if booking[11] == 'On Time' %}selected{% endif %}>On Time</option>
                    <option value="Boarding" {% if booking[11] == 'Boarding' %}selected{% endif %}>Boarding</option>
                    <option value="Delayed" {% if booking[11] == 'Delayed' %}selected{% endif %}>Delayed</option>
                    <option value="Departed" {% if booking[11] == 'Departed' %}selected{% endif %}>Departed</option>
                    <option value="Cancelled" {% if booking[11] == 'Cancelled' %}selected{% endif %}>Cancelled</option>
                </select>
                <button type="submit">Update</button>
                </form>
                </td>
                <td>
                <a href="/deletebooking/{{ booking[0] }}" class="delete-btn" onclick="return confirm('Are you sure you want to cancel this booking?')">
                🚫 Cancel Booking
                </a>
                </td>
            </tr>

            {% endfor %}

        </table>

    </div>

</div>

</body>
</html>
